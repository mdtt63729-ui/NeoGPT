name: Build unsigned release APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true

          test -f "${ANDROID_SDK_ROOT}/platforms/android-36/android.jar"
          test -x "${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --version

      - name: Verify release-only build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          grep -Eq 'compileSdk\s*=\s*36' app/build.gradle.kts
          grep -Eq 'targetSdk\s*=\s*36' app/build.gradle.kts
          grep -Eq 'composeBom\s*=\s*"2026\.06\.01"' gradle/libs.versions.toml
          grep -Eq 'assembleRelease' .github/workflows/android-build.yml
          forbidden_task="assemble""Debug"
          if grep -Eq "(^|[^A-Za-z])${forbidden_task}([^A-Za-z]|$)" .github/workflows/android-build.yml; then
            echo "Debug build is not allowed."
            exit 1
          fi

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          # This repository intentionally does not rely on a Gradle wrapper.
          # setup-gradle installs the exact requested Gradle version and puts
          # the executable on PATH, so invoke that provisioned Gradle directly.
          command -v gradle
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          test -s "$APK"
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Confirm APK is unsigned
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if command -v apksigner >/dev/null 2>&1; then
            if apksigner verify "$APK" >/dev/null 2>&1; then
              echo "Unexpectedly signed APK detected."
              exit 1
            fi
          fi
          if unzip -l "$APK" | grep -E 'META-INF/[^/]+\.(RSA|DSA|EC)$' >/dev/null; then
            echo "Signature block detected in APK."
            exit 1
          fi
          echo "Unsigned release APK confirmed."

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoGPT-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
