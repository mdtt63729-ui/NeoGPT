name: NeoGPT Unsigned Release APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-release:
    name: Build unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-37' \
            'build-tools;36.0.0'

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -s app/src/main/res/font/josefin_sans_regular.ttf

      - name: Build unsigned release APK only
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Verify release APK exists and is unsigned
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"

          # An unsigned APK must not contain legacy JAR-signing metadata.
          if unzip -l "$APK" | grep -Eq 'META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then
            echo 'ERROR: release APK contains signing metadata; expected unsigned APK.'
            exit 1
          fi

          echo "Verified: unsigned release APK"
          file "$APK"

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoGPT-unsigned-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
