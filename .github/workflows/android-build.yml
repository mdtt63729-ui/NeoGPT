name: NeoGPT Android Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build unsigned release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          # GitHub-hosted Ubuntu runners already contain the Android SDK, but
          # sdkmanager is not guaranteed to be on PATH. Discover it explicitly.
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          sdkmanager_bin=""
          if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            sdkmanager_bin="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            sdkmanager_bin="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "${sdkmanager_bin}" ]; then
            echo "ERROR: Android sdkmanager was not found under ${ANDROID_SDK_ROOT}/cmdline-tools."
            echo "Available Android SDK directories:"
            ls -la "${ANDROID_SDK_ROOT}" || true
            exit 1
          fi

          export PATH="$(dirname "${sdkmanager_bin}"):${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "PATH=${PATH}" >> "${GITHUB_ENV}"

          # Accept licenses without allowing the yes|sdkmanager pipeline's
          # normal SIGPIPE exit to fail the workflow under pipefail.
          yes | "${sdkmanager_bin}" --licenses >/dev/null 2>&1 || true
          "${sdkmanager_bin}" "platform-tools" "platforms;android-37" "build-tools;35.0.0"

          test -d "${ANDROID_SDK_ROOT}/platforms/android-37"
          test -d "${ANDROID_SDK_ROOT}/build-tools/35.0.0"

      - name: Verify release-only build configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml

          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts

          if grep -RIn --exclude-dir=.git --exclude-dir=build 'assembleDebug' .github app build.gradle.kts settings.gradle.kts; then
            echo "ERROR: Debug APK build command/reference detected."
            exit 1
          fi

          grep -q 'assembleRelease' .github/workflows/android-build.yml

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)

          if [ "${#apks[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one release APK, found ${#apks[@]}."
            printf '%s\n' "${apks[@]:-<none>}"
            exit 1
          fi

          apk="${apks[0]}"
          echo "Release APK: ${apk}"
          ls -lh "${apk}"


      - name: Confirm APK is unsigned
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print -quit)"
          test -n "$apk"
          if command -v apksigner >/dev/null 2>&1 && apksigner verify --print-certs "$apk" >/dev/null 2>&1; then
            echo "ERROR: Release APK is signed; expected unsigned APK."
            exit 1
          fi

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoGPT-unsigned-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
