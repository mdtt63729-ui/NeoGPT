name: NeoGPT Android Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build unsigned release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;35.0.0"

          test -d "${ANDROID_SDK_ROOT}/platforms/android-37"
          test -d "${ANDROID_SDK_ROOT}/build-tools/35.0.0"

      - name: Verify release-only build configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml

          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts

          if grep -RIn --exclude-dir=.git --exclude-dir=build 'assembleDebug' .github app build.gradle.kts settings.gradle.kts; then
            echo "ERROR: Debug APK build command/reference detected."
            exit 1
          fi

          grep -q 'assembleRelease' .github/workflows/android-build.yml

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)

          if [ "${#apks[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one release APK, found ${#apks[@]}."
            printf '%s\n' "${apks[@]:-<none>}"
            exit 1
          fi

          apk="${apks[0]}"
          echo "Release APK: ${apk}"
          ls -lh "${apk}"


      - name: Confirm APK is unsigned
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print -quit)"
          test -n "$apk"
          if command -v apksigner >/dev/null 2>&1 && apksigner verify --print-certs "$apk" >/dev/null 2>&1; then
            echo "ERROR: Release APK is signed; expected unsigned APK."
            exit 1
          fi

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoGPT-unsigned-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
