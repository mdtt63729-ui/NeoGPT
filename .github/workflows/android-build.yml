name: NeoGPT Unsigned Release APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-release:
    name: Build unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          # API 37 is currently published by Google's SDK repository as preview
          # package revisions (for example android-37.0/android-37.2-beta3),
          # not as the literal package id platforms;android-37.
          # Discover the API 37 package that this runner exposes instead of
          # requesting a package id that may not exist in the remote repository.
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          SDK_LIST="$(sdkmanager --list 2>/dev/null)"
          API37_PACKAGE=""
          for candidate in \
            'platforms;android-37.0' \
            'platforms;android-37' \
            'platforms;android-37.1' \
            'platforms;android-37.2' \
            'platforms;android-37.2-beta3' \
            'platforms;android-37.2-beta2' \
            'platforms;android-37.2-beta1'; do
            if printf '%s\n' "$SDK_LIST" | grep -F "$candidate" >/dev/null; then
              API37_PACKAGE="$candidate"
              break
            fi
          done

          if [ -z "$API37_PACKAGE" ]; then
            echo 'ERROR: No Android API 37 SDK platform package is available on this runner.'
            echo 'Available Android SDK platform packages:'
            printf '%s\n' "$SDK_LIST" | grep -E 'platforms;android-3[0-9]' || true
            exit 1
          fi

          echo "Installing API 37 SDK platform: $API37_PACKAGE"
          sdkmanager \
            'platform-tools' \
            "$API37_PACKAGE" \
            'build-tools;36.0.0'

          # AGP resolves compileSdk 37 from the canonical android-37 directory.
          # Preview API 37 packages may be installed under android-37.x, so create
          # a local compatibility link when necessary.
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            API37_DIR="$(find "$ANDROID_SDK_ROOT/platforms" -maxdepth 1 -type d -name 'android-37*' | sort -V | tail -n 1)"
            if [ -z "$API37_DIR" ]; then
              echo 'ERROR: API 37 SDK platform was not installed.'
              exit 1
            fi
            ln -s "$API37_DIR" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"
          echo "Using SDK platform: $ANDROID_SDK_ROOT/platforms/android-37"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -s app/src/main/res/font/josefin_sans_regular.ttf

          # Guard against framework-style references that are unavailable in
          # the API 37 platform package used by CI. The app uses the stable
          # API-21+ Material framework base style instead.
          if grep -R --line-number 'android:style/Theme.Material.DayNight.NoActionBar' app/src/main/res; then
            echo 'ERROR: unsupported Theme.Material.DayNight.NoActionBar reference remains.'
            exit 1
          fi

      - name: Build unsigned release APK only
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Verify release APK exists and is unsigned
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"

          # An unsigned APK must not contain legacy JAR-signing metadata.
          if unzip -l "$APK" | grep -Eq 'META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then
            echo 'ERROR: release APK contains signing metadata; expected unsigned APK.'
            exit 1
          fi

          echo "Verified: unsigned release APK"
          file "$APK"

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoGPT-unsigned-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
