# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Disabled for maximum compatibility with KSP/Hilt/Android Gradle Plugin in CI.
org.gradle.configuration-cache=false
android.useAndroidX=true
kotlin.code.style=official

# Keep legacy Kotlin plugin compatibility while this project migrates to AGP 9.1.
android.builtInKotlin=false
android.newDsl=false

# Keep Room annotation processing on the stable KSP1 implementation for this Kotlin 2.0 toolchain.
ksp.useKSP2=false
